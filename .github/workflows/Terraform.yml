name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: threatlens
  TF_IN_AUTOMATION: true
  TF_INPUT: false

concurrency:
  group: threatlens-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::113462084471:role/threatlens-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------
      # Terraform quality checks
      # -------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # -------------------------
      # Terraform linting
      # -------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Initialise TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      # -------------------------
      # IaC security scanning
      # -------------------------

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform

      # -------------------------
      # Terraform Plan
      # -------------------------

      - name: Terraform Plan
        if: |
          github.event_name == 'push' ||
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.event.inputs.action == 'plan' ||
            github.event.inputs.action == 'apply'))
        run: |
          terraform plan \
            -out=tfplan \

      # -------------------------
      # Terraform Apply
      # -------------------------

      - name: Terraform Apply
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      # -------------------------
      # Terraform Destroy
      # -------------------------

      - name: Terraform Destroy Plan
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'destroy'
        run: |
          terraform plan \
            -destroy \
            -out=destroy.tfplan \

      - name: Terraform Destroy
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'destroy'
        run: terraform apply -auto-approve destroy.tfplan